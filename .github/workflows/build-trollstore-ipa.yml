name: Build TrollStore IPA

on:
  push:
    branches: [ main ]
    paths:
      - 'KurageAI15.zip'
      - 'KurageAI15/**'
      - 'KurageAI15.xcodeproj/**'
      - 'Frameworks/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack project zip if needed
        run: |
          if ! find . -name "KurageAI15.xcodeproj" -maxdepth 4 | grep -q .; then
            ZIP=$(ls *.zip 2>/dev/null | head -1)
            if [ -z "$ZIP" ]; then
              echo "プロジェクトも zip も見つかりません" >&2
              exit 1
            fi
            unzip -o "$ZIP"
          fi
          PROJ=$(find . -name "KurageAI15.xcodeproj" -maxdepth 4 | head -1)
          echo "PROJ_PATH=$PROJ" >> "$GITHUB_ENV"
          echo "PROJ_DIR=$(dirname "$PROJ")" >> "$GITHUB_ENV"
          echo "Using project: $PROJ"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Download official llama.xcframework (ggml-org/llama.cpp b12375)
        run: |
          set -e
          curl -fL -o "$RUNNER_TEMP/llama-xcf.zip" \
            "https://github.com/ggml-org/llama.cpp/releases/download/b12375/llama-b12375-xcframework.zip"
          echo "af1d2a7dd5a64eeb39ceba0672ae3fef86b16567c58d44ea33d437230695bfe3  $RUNNER_TEMP/llama-xcf.zip" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/xcf"
          unzip -qo "$RUNNER_TEMP/llama-xcf.zip" -d "$RUNNER_TEMP/xcf"
          XCF=$(find "$RUNNER_TEMP/xcf" -name "llama.xcframework" -maxdepth 4 | head -1)
          if [ -z "$XCF" ]; then
            echo "llama.xcframework が zip 内に見つかりません" >&2
            find "$RUNNER_TEMP/xcf" -maxdepth 3 >&2
            exit 1
          fi
          DEST="$PROJ_DIR/Frameworks"
          mkdir -p "$DEST"
          rm -rf "$DEST/llama.xcframework"
          cp -R "$XCF" "$DEST/"
          echo "Installed: $DEST/llama.xcframework"

      - name: Check XCFramework minimum iOS version
        run: |
          DEST="$PROJ_DIR/Frameworks"
          read_minos() {
            local plist="$DEST/llama.xcframework/ios-arm64/llama.framework/Info.plist"
            if [ ! -f "$plist" ]; then
              plist=$(find "$DEST/llama.xcframework" -path "*ios-arm64*" -name "Info.plist" 2>/dev/null | grep -v dSYM | head -1)
            fi
            if [ -z "$plist" ] || [ ! -f "$plist" ]; then
              echo "plist not found" >&2
              ls -R "$DEST/llama.xcframework" >&2 || true
              echo "unknown"
              return
            fi
            echo "reading plist: $plist" >&2
            plutil -extract MinimumOSVersion raw -o - "$plist" 2>/dev/null || echo "unknown"
          }
          ls "$DEST/llama.xcframework" || true
          otool -l "$DEST/llama.xcframework/ios-arm64/llama.framework/llama" 2>/dev/null | grep -A3 LC_BUILD_VERSION | head -8 || true
          MINOS=$(read_minos)
          echo "llama.xcframework ios-arm64 MinimumOSVersion: $MINOS" | tee "$RUNNER_TEMP/xcf-minos.txt"
          NEED=0
          if [ "$MINOS" = "unknown" ]; then
            echo "最小OSを確認できませんでした。自前ビルドで確実に 15.0 指定して作り直します。"
            NEED=1
          elif [ "$MINOS" != "15.0" ] && [ "$(printf '15.0\n%s\n' "$MINOS" | sort -V | tail -1)" = "$MINOS" ]; then
            echo "最小OS $MINOS は iOS 15.0 より大きいため、このままでは iPhone 7 で動きません。自前ビルドに切り替えます。"
            NEED=1
          fi
          echo "NEED_SOURCE_BUILD=$NEED" >> "$GITHUB_ENV"

      - name: Fallback - build XCFramework from source with iOS 15 target
        if: env.NEED_SOURCE_BUILD == '1'
        run: |
          set -o pipefail
          git clone --depth 1 --branch b12375 https://github.com/ggml-org/llama.cpp.git "$RUNNER_TEMP/llama.cpp" 2>&1 | tee "$RUNNER_TEMP/xcf-build.log"
          cd "$RUNNER_TEMP/llama.cpp"
          echo "--- deployment target lines in build-xcframework.sh ---" | tee -a "$RUNNER_TEMP/xcf-build.log"
          grep -n "DEPLOYMENT_TARGET\|MIN_OS\|16\.4" build-xcframework.sh | tee -a "$RUNNER_TEMP/xcf-build.log" || true
          sed -i '' -E 's/16\.4/15.0/g' build-xcframework.sh
          echo "--- after sed ---" | tee -a "$RUNNER_TEMP/xcf-build.log"
          grep -n "IOS_MIN_OS_VERSION=" build-xcframework.sh | tee -a "$RUNNER_TEMP/xcf-build.log" || true
          ./build-xcframework.sh 2>&1 | tee -a "$RUNNER_TEMP/xcf-build.log"
          DEST="$GITHUB_WORKSPACE/$PROJ_DIR/Frameworks"
          rm -rf "$DEST/llama.xcframework"
          cp -R build-apple/llama.xcframework "$DEST/"
          PLIST="$DEST/llama.xcframework/ios-arm64/llama.framework/Info.plist"
          if [ ! -f "$PLIST" ]; then
            PLIST=$(find "$DEST/llama.xcframework" -path "*ios-arm64*" -name "Info.plist" 2>/dev/null | grep -v dSYM | head -1)
          fi
          echo "reading plist: $PLIST" | tee -a "$RUNNER_TEMP/xcf-build.log"
          ls "$DEST/llama.xcframework" | tee -a "$RUNNER_TEMP/xcf-build.log" || true
          otool -l "$DEST/llama.xcframework/ios-arm64/llama.framework/llama" 2>/dev/null | grep -A3 LC_BUILD_VERSION | head -8 | tee -a "$RUNNER_TEMP/xcf-build.log" || true
          MINOS=$(plutil -extract MinimumOSVersion raw -o - "$PLIST" 2>/dev/null || echo "unknown")
          echo "source-built MinimumOSVersion: $MINOS" | tee -a "$RUNNER_TEMP/xcf-build.log"
          if [ "$MINOS" = "unknown" ] || { [ "$MINOS" != "15.0" ] && [ "$(printf '15.0\n%s\n' "$MINOS" | sort -V | tail -1)" = "$MINOS" ]; }; then
            echo "自前ビルドでも最小OSを 15.0 以下にできませんでした（現在: $MINOS）。iPhone 7 では動かないため、ここで止めます。" >&2
            exit 1
          fi

      - name: Build unsigned app
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJ_PATH" \
            -scheme KurageAI15 \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Inspect built app
        run: |
          APP=$(find "$RUNNER_TEMP/DerivedData/Build/Products" -name "KurageAI15.app" -maxdepth 2 | head -1)
          echo "APP=$APP" >> "$GITHUB_ENV"
          ls -R "$APP" | head -50
          otool -L "$APP/KurageAI15" | grep -i -E "llama|Accelerate|Metal" || true

      - name: Package TrollStore IPA
        run: |
          if [ -z "$APP" ]; then
            echo ".app が生成されませんでした" >&2
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry KurageAI15.tipa Payload
          cp KurageAI15.tipa KurageAI15.ipa
          ls -lh KurageAI15.tipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: KurageAI15-tipa
          path: |
            KurageAI15.tipa
            KurageAI15.ipa
          if-no-files-found: error

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/xcf-build.log
            ${{ runner.temp }}/xcf-minos.txt
          if-no-files-found: ignore
